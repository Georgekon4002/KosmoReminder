<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>KosmoReminder Dashboard</title>
    <!-- Google Fonts: Inter -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <!-- Custom CSS -->
    <link rel="stylesheet" href="/static/css/styles.css">
    <!-- Phosphor Icons for beautiful UI icons -->
    <script src="https://unpkg.com/@phosphor-icons/web"></script>
</head>

<body>
    <div class="dashboard-container">
        <!-- Sidebar or Header -->
        <header class="top-nav glass-panel">
            <div class="logo">
                <img src="/static/images/KosmoReminder_Logo.png" alt="KosmoReminder Logo"
                    style="height: 32px; width: auto; filter: drop-shadow(0 0 8px rgba(59, 130, 246, 0.5));">
                <h1>KosmoReminder</h1>
            </div>
            <div class="user-info">
                <span>Dashboard</span>
                <div class="status-indicator live">
                    <span class="pulse"></span> Live
                </div>
            </div>
        </header>

        <main class="main-content">
            <!-- Tab Navigation -->
            <div class="tabs-container">
                <button class="tab-btn active" data-mode="all-time">All Time</button>
                <button class="tab-btn" data-mode="today">Today</button>
            </div>

            <!-- Stats Grid -->
            <section class="stats-grid" id="stats-section">
                <div class="stat-card glass-panel fade-in" style="--delay: 0.1s" id="card-total">
                    <div class="stat-icon purple"><i class="ph ph-hash"></i></div>
                    <div class="stat-info">
                        <h3 id="stat-total-title">Total Processed</h3>
                        <p id="stat-total" class="stat-value">--</p>
                    </div>
                </div>
                <div class="stat-card glass-panel fade-in" style="--delay: 0.2s">
                    <div class="stat-icon blue"><i class="ph ph-paper-plane-right"></i></div>
                    <div class="stat-info">
                        <h3>Sent</h3>
                        <p id="stat-sent" class="stat-value">--</p>
                    </div>
                </div>
                <div class="stat-card glass-panel fade-in" style="--delay: 0.3s">
                    <div class="stat-icon green"><i class="ph ph-check-circle"></i></div>
                    <div class="stat-info">
                        <h3>Delivered</h3>
                        <p id="stat-delivered" class="stat-value">--</p>
                    </div>
                </div>
                <div class="stat-card glass-panel fade-in" style="--delay: 0.4s">
                    <div class="stat-icon red"><i class="ph ph-warning-circle"></i></div>
                    <div class="stat-info">
                        <h3>Failed / Rejected</h3>
                        <p id="stat-failed" class="stat-value">--</p>
                    </div>
                </div>
            </section>

            <!-- Data Table -->
            <section class="table-section glass-panel fade-in" style="--delay: 0.5s">
                <div class="table-header">
                    <h2>Recent Messages</h2>
                    <button id="refresh-btn" class="btn-refresh">
                        <i class="ph ph-arrows-clockwise"></i> Refresh
                    </button>
                </div>
                <div class="table-responsive">
                    <table class="data-table">
                        <thead>
                            <tr>
                                <th>Patient</th>
                                <th>Time</th>
                                <th>Phone</th>
                                <th>Email Status</th>
                                <th>SMS Status</th>
                                <th>Channel</th>
                                <th>Sent At</th>
                            </tr>
                        </thead>
                        <tbody id="messages-tbody">
                            <!-- Rows will be populated by JS -->
                            <tr>
                                <td colspan="7" class="loading-state">
                                    <i class="ph ph-spinner-gap spin"></i> Loading data...
                                </td>
                            </tr>
                        </tbody>
                    </table>
                </div>

                <!-- Pagination Controls -->
                <div class="pagination-container" id="pagination-controls"
                    style="display: none; justify-content: center; align-items: center; gap: 1rem; margin-top: 1rem; padding: 1rem 0;">
                    <button id="page-prev" class="btn-refresh" style="min-width: 100px;"><i
                            class="ph ph-caret-left"></i> Prev Week</button>
                    <span id="page-info" style="font-weight: 500;">Select Week</span>
                    <button id="page-next" class="btn-refresh" style="min-width: 100px;">Next Week <i
                            class="ph ph-caret-right"></i></button>
                </div>
            </section>
        </main>
    </div>

    <!-- App Logic -->
    <script src="/static/js/app.js"></script>
</body>

</html>
